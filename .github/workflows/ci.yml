name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json `packageManager`
      # field, so the lock file is always written by the version that wrote it
      # locally. Must run before setup-node, which needs pnpm on PATH to cache.
      - uses: pnpm/action-setup@v4

      # .nvmrc is the single source of truth for the Node version.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # Covers the workspaces that have no build step to type-check them. The
      # Next app deliberately has no typecheck task of its own: tsc there would
      # read .next/types, which next build rewrites underneath it.
      - run: pnpm run typecheck

      # The workspaces whose tests need nothing but Node. The API's suite is not
      # here: it applies migrations and truncates tables against a real Postgres
      # named by apps/api/.env.test, and there is no database on this runner
      # yet. Until there is, `pnpm --filter @mariva/api test` stays a local gate
      # and this line covers the rest rather than covering nothing.
      - run: pnpm exec turbo run test --filter=@mariva/web --filter=@mariva/shared

      # next build runs the TypeScript check for the app as part of the build.
      - run: pnpm run build
